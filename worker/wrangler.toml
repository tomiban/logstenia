name = "logstenia-sync"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# One Worker serves the built SPA and owns /api/*; only API routes invoke the script.
[assets]
directory = "../app/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "logstenia-sync"
# Created with `npx wrangler d1 create logstenia-sync`; `npm run preflight` refuses to deploy
# while this is the all-zero placeholder (scripts/preflight.mjs).
database_id = "0e7f4518-9303-4edb-8f95-8c64b11560a9"

[vars]
# Zero Trust -> Settings -> Team domain, prefix only (before `.cloudflareaccess.com`), and
# the Access application's Application Audience (AUD) Tag. `npm run deploy` refuses to run
# while either value is still a shipped sample (scripts/preflight.mjs). See docs/DEPLOY.md.
CF_ACCESS_TEAM = "blue-block-5811"
CF_ACCESS_AUD = "f5979721b059b516079f2607497f44ac1523ec14659df9bb77ed429a6014f382"
